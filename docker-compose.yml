services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=38765
    restart: unless-stopped
    networks:
      - traefik_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.git-learning.rule=PathPrefix(`/git`)"
      - "traefik.http.routers.git-learning.entrypoints=web"
      - "traefik.http.services.git-learning.loadbalancer.server.port=38765"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:38765/git/api/modules"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

networks:
  traefik_default:
    external: true
