version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "38765:38765"
    environment:
      - NODE_ENV=production
      - PORT=38765
    restart: unless-stopped
    volumes:
      # Mount these directories as volumes for development
      # Comment out in production
      - ./backend/src:/app/backend/src
      - ./frontend/src:/app/frontend/src
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:38765/api/modules"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
